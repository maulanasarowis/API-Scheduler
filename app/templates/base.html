<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}API Scheduler{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/"><i class="bi bi-clock-history text-primary"></i> API Scheduler</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='dashboard' }}" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='apis' }}" href="/apis"><i class="bi bi-plug"></i> Daftar API</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='logs' }}" href="/logs"><i class="bi bi-list-check"></i> Riwayat Eksekusi</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
